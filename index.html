<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Будешь моей Валентинкой? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffc3e1 50%, #ff9dc6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            animation: fadeIn 0.8s ease-in;
            position: relative;
            z-index: 10;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gif-container {
            margin-bottom: 30px;
        }

        .gif-container img {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #ff1b8d;
            font-size: 2.5em;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
            min-height: 150px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff1b8d 100%);
            color: white;
            transform-origin: center;
            transition: transform 0.3s ease, padding 0.3s ease, font-size 0.3s ease;
        }

        .btn-yes:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 27, 141, 0.4);
        }

        .btn-yes:active {
            transform: scale(0.98);
        }

        .btn-no {
            background: linear-gradient(135deg, #ddd 0%, #bbb 100%);
            color: #333;
            position: absolute;
            transition: all 0.3s ease;
        }

        .btn-no:hover {
            transform: scale(1.05);
        }

        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-40px) rotate(15deg);
            }
        }

        .floating-heart:nth-child(1) { left: 5%; top: 20%; animation-delay: 0s; }
        .floating-heart:nth-child(2) { left: 25%; top: 60%; animation-delay: 2s; }
        .floating-heart:nth-child(3) { left: 50%; top: 30%; animation-delay: 4s; }
        .floating-heart:nth-child(4) { left: 75%; top: 70%; animation-delay: 1s; }
        .floating-heart:nth-child(5) { left: 90%; top: 40%; animation-delay: 3s; }
        .floating-heart:nth-child(6) { left: 15%; top: 80%; animation-delay: 5s; }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .btn {
                padding: 12px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-bg">
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">💕</div>
        <div class="floating-heart">💖</div>
        <div class="floating-heart">💗</div>
        <div class="floating-heart">💝</div>
        <div class="floating-heart">❤️</div>
    </div>

    <div class="container">
        <div class="gif-container">
            <img src="main.gif" alt="Romantic GIF">
        </div>

        <h1>Будешь моей Валентинкой? 💝</h1>

        <div class="buttons-container">
            <button class="btn btn-yes" id="yesBtn">Да! 💕</button>
            <button class="btn btn-no" id="noBtn">Нет</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const container = document.querySelector('.container');

        let noClickCount = 0;
        let yesBtnScale = 1;

        // Тексты для кнопки "Нет"
        const noTexts = [
            "Нет",
            "Ты уверена??",
            "Пожалуйста, пожалуйста...",
            "Подумай хорошенько!",
            "Ты точно не хочешь?",
            "Может быть, все-таки да?"
        ];

        // Функция для перемещения кнопки "Нет" в случайное место
        function moveNoButton() {
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            // Получаем размеры окна
            const maxX = window.innerWidth - btnRect.width - 40;
            const maxY = window.innerHeight - btnRect.height - 40;

            // Генерируем случайные координаты
            const randomX = Math.random() * maxX + 20;
            const randomY = Math.random() * maxY + 20;

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Увеличиваем счетчик и меняем текст
            noClickCount++;
            const textIndex = noClickCount % noTexts.length;
            noBtn.textContent = noTexts[textIndex];

            // Увеличиваем кнопку "Да"
            yesBtnScale += 0.3;
            yesBtn.style.transform = `scale(${yesBtnScale})`;
            yesBtn.style.padding = `${15 + noClickCount * 3}px ${40 + noClickCount * 5}px`;
            yesBtn.style.fontSize = `${1.2 + noClickCount * 0.1}em`;
        }

        // При наведении на кнопку "Нет" она убегает
        noBtn.addEventListener('mouseenter', moveNoButton);

        // При попытке нажатия на кнопку "Нет" она тоже убегает
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // При нажатии на кнопку "Да" переходим на страницу успеха
        yesBtn.addEventListener('click', () => {
            window.location.href = 'yes_page.html';
        });

        // Инициализируем позицию кнопки "Нет"
        window.addEventListener('load', () => {
            const containerRect = container.getBoundingClientRect();
            noBtn.style.position = 'absolute';
            noBtn.style.left = (containerRect.left + containerRect.width / 2 + 80) + 'px';
            noBtn.style.top = (containerRect.top + containerRect.height - 120) + 'px';
        });
    </script>
</body>
</html>
