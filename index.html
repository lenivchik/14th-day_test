<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Святого Валентина!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart {
            font-size: 80px;
            color: #ff1744;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.1);
            }
            50% {
                transform: scale(1);
            }
        }

        h1 {
            color: #ff1744;
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .message {
            color: #333;
            font-size: 1.3em;
            line-height: 1.6;
            margin: 30px 0;
        }

        .date {
            color: #764ba2;
            font-size: 1.2em;
            font-weight: 600;
            margin-top: 30px;
        }

        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-heart {
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(10deg);
            }
        }

        .floating-heart:nth-child(1) { left: 10%; animation-delay: 0s; }
        .floating-heart:nth-child(2) { left: 30%; animation-delay: 2s; }
        .floating-heart:nth-child(3) { left: 50%; animation-delay: 4s; }
        .floating-heart:nth-child(4) { left: 70%; animation-delay: 1s; }
        .floating-heart:nth-child(5) { left: 90%; animation-delay: 3s; }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .message {
                font-size: 1.1em;
            }
            
            .heart {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-bg">
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">💕</div>
        <div class="floating-heart">💖</div>
        <div class="floating-heart">💗</div>
        <div class="floating-heart">❤️</div>
    </div>

    <div class="container">
        <div class="heart">❤️</div>
        <h1>С Днём Святого Валентина!</h1>
        
        <div class="message">
            Желаем вам любви, счастья и радости!<br>
            Пусть каждый день будет наполнен теплом,<br>
            добротой и взаимопониманием!
        </div>

        <div class="date">14 февраля 2026</div>
    </div>
</body>
</html>
