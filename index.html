<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Будешь моей Валентинкой? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffc3e1 50%, #ff9dc6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px 25px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            animation: fadeIn 0.8s ease-in;
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gif-container {
            margin-bottom: 20px;
        }

        .gif-container img {
            max-width: 100%;
            max-height: 250px;
            width: auto;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            object-fit: contain;
        }

        h1 {
            color: #ff1b8d;
            font-size: 2em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
            min-height: 80px;
            transition: min-height 0.3s ease;
        }

        .btn {
            padding: 12px 35px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff1b8d 100%);
            color: white;
            transition: all 0.3s ease;
        }

        .btn-yes:hover {
            box-shadow: 0 8px 25px rgba(255, 27, 141, 0.4);
        }

        .btn-yes:active {
            opacity: 0.9;
        }

        .btn-no {
            background: linear-gradient(135deg, #ddd 0%, #bbb 100%);
            color: #333;
            transition: all 0.3s ease;
            min-width: 200px;
        }
        
        .btn-no.floating {
            position: fixed;
        }

        .btn-no:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-40px) rotate(15deg);
            }
        }

        .floating-heart:nth-child(1) { left: 5%; top: 20%; animation-delay: 0s; }
        .floating-heart:nth-child(2) { left: 25%; top: 60%; animation-delay: 2s; }
        .floating-heart:nth-child(3) { left: 50%; top: 30%; animation-delay: 4s; }
        .floating-heart:nth-child(4) { left: 75%; top: 70%; animation-delay: 1s; }
        .floating-heart:nth-child(5) { left: 90%; top: 40%; animation-delay: 3s; }
        .floating-heart:nth-child(6) { left: 15%; top: 80%; animation-delay: 5s; }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .btn {
                padding: 12px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-bg">
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">💕</div>
        <div class="floating-heart">💖</div>
        <div class="floating-heart">💗</div>
        <div class="floating-heart">💝</div>
        <div class="floating-heart">❤️</div>
    </div>

    <div class="container">
        <div class="gif-container">
            <img src="main.gif" alt="Romantic GIF">
        </div>

        <h1>Будешь моей Валентинкой? 💝</h1>

        <div class="buttons-container">
            <button class="btn btn-yes" id="yesBtn">Да! 💕</button>
            <button class="btn btn-no" id="noBtn">Нет</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const container = document.querySelector('.container');

        let noClickCount = 0;

        // Тексты для кнопки "Нет"
        const noTexts = [
            "Нет",
            "Ты уверена??",
            "Пожалуйста, пожалуйста...",
            "Подумай хорошенько!",
            "Ты точно не хочешь?",
            "Может быть, все-таки да?"
        ];

        // Функция для перемещения кнопки "Нет" в случайное место
        function moveNoButton() {
            // При первом вызове делаем кнопку плавающей
            if (!noBtn.classList.contains('floating')) {
                noBtn.classList.add('floating');
            }
            
            // Увеличиваем счетчик и меняем текст
            noClickCount++;
            const textIndex = noClickCount % noTexts.length;
            noBtn.textContent = noTexts[textIndex];

            // Отступы от краев экрана
            const margin = 20;
            
            // Используем фиксированную ширину кнопки (min-width из CSS)
            const btnWidth = 200;
            const btnHeight = 50;
            
            // Рассчитываем безопасные границы
            const minX = margin;
            const maxX = window.innerWidth - btnWidth - margin;
            const minY = margin;
            const maxY = window.innerHeight - btnHeight - margin;

            // Генерируем случайные координаты в безопасных границах
            const randomX = Math.random() * (maxX - minX) + minX;
            const randomY = Math.random() * (maxY - minY) + minY;

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Увеличиваем кнопку "Да" и контейнер кнопок
            yesBtn.style.padding = `${12 + noClickCount * 4}px ${35 + noClickCount * 6}px`;
            yesBtn.style.fontSize = `${1.1 + noClickCount * 0.15}em`;
            
            // Увеличиваем высоту контейнера кнопок
            const buttonsContainer = document.querySelector('.buttons-container');
            buttonsContainer.style.minHeight = `${80 + noClickCount * 20}px`;
        }

        // При наведении на кнопку "Нет" она убегает
        noBtn.addEventListener('mouseenter', moveNoButton);

        // При попытке нажатия на кнопку "Нет" она тоже убегает
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // При нажатии на кнопку "Да" переходим на страницу успеха
        yesBtn.addEventListener('click', () => {
            window.location.href = 'yes_page.html';
        });
    </script>
</body>
</html>
